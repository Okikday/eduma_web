<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta id="theme-color-scheme" name="color-scheme" content="light dark" />
  <script>
    (function () {
      var meta = document.getElementById('theme-color-scheme');
      var storedMode = null;
      var storedFont = null;
      var storedBlur = null;
      try {
        storedMode = localStorage.getItem('eduma_theme_mode');
        storedFont = localStorage.getItem('eduma_font_family');
        storedBlur = localStorage.getItem('eduma_reduce_blur');
      } catch (e) { }

      var scheme = storedMode === 'light' || storedMode === 'dark' ? storedMode : 'light dark';
      if (meta) {
        meta.setAttribute('content', scheme);
      }
      document.documentElement.dataset.themeMode = storedMode || 'system';
      if (storedFont) {
        document.documentElement.dataset.font = storedFont;
      }
      if (storedBlur === 'true') {
        document.documentElement.dataset.reduceBlur = 'true';
      }
    })();
  </script>
  <title>Eduma — Your study workspace</title>
  <meta name="description"
    content="Collaborative notes, study spaces, flashcards, calendar scheduling, and resource library." />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preload" href="/assets/fonts/Raleway-Variable.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/assets/fonts/icons/FlutterIconsax.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/icons/hugeicons-solid.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/icons/hugeicons-stroke.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Agbalumo&family=Bellota:wght@400;700&family=Cal+Sans&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/google-sign-in.js" defer></script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
